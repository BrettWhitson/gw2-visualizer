<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Keep in sync with the other pages and _headers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://render.guildwars2.com; connect-src 'self' https://api.guildwars2.com https://wiki.guildwars2.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Engine sandbox · GW2 Visualizer (unofficial fansite)</title>
    <meta
      name="description"
      content="Unofficial fansite. Play with Prism and Tether, the graph rendering and physics engines behind GW2 Visualizer's crafting graphs."
    />
    <meta name="theme-color" content="#151a24" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://render.guildwars2.com" crossorigin />

    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/sandbox.css" />
  </head>
  <body>
    <a class="skip-link" href="#sbPanel">Skip to the controls</a>
    <noscript
      ><p class="noscript">
        GW2 Visualizer needs JavaScript enabled.
      </p></noscript
    >

    <header id="topbar"><div class="spacer"></div></header>

    <main class="sandbox">
      <aside id="sbPanel" class="sb-panel" aria-label="Sandbox controls">
        <details class="sb-group" open>
          <summary>Graph</summary>
          <div class="sb-body">
            <label class="sb-row"
              >Shape <select id="sbShape"></select
            ></label>
            <label class="sb-row"
              >Items
              <input
                id="sbSize"
                type="range"
                min="1"
                max="4"
                step="0.01"
                value="2.08"
              />
              <output id="sbSizeOut"></output
            ></label>
            <label class="sb-row"
              >Branching
              <input id="sbBranching" type="range" min="1" max="10" value="4" />
              <output id="sbBranchingOut"></output
            ></label>
            <label class="sb-row"
              >Shared
              <input
                id="sbShared"
                type="range"
                min="0"
                max="0.6"
                step="0.01"
                value="0.15"
              />
              <output id="sbSharedOut"></output
            ></label>
            <label class="sb-row"
              >Seed <input id="sbSeed" type="number" min="1" value="1" />
              <button
                type="button"
                id="sbReseed"
                title="Another random graph"
                aria-label="Another random seed"
              >
                ⟳
              </button></label
            >
            <label class="sb-row"
              >Colour
              <select id="sbColorBy">
                <option value="rarity">By rarity</option>
                <option value="depth">By depth</option>
              </select></label
            >
            <label class="sb-check"
              ><input id="sbStates" type="checkbox" checked /> Owned, better
              buys and Mystic Forge looks</label
            >
            <label class="sb-check"
              ><input id="sbIcons" type="checkbox" checked /> Real item icons (from the
              GW2 API)</label
            >
          </div>
        </details>

        <details class="sb-group" open>
          <summary>Play</summary>
          <div class="sb-body sb-buttons">
            <button
              type="button"
              data-action="grow"
              title="Give a random item new ingredients (they unfold from it)"
            >
              Grow
            </button>
            <button
              type="button"
              data-action="collapse"
              title="Fold a random branch into its item"
            >
              Collapse
            </button>
            <button
              type="button"
              data-action="expand"
              title="Unfold everything"
            >
              Expand all
            </button>
            <button
              type="button"
              data-action="scatter"
              title="Throw every item off its place and let the physics pull the graph back together"
            >
              Scatter
            </button>
            <button
              type="button"
              data-action="shake"
              title="Heat the physics and watch it settle"
            >
              Shake
            </button>
            <button
              type="button"
              data-action="recolour"
              title="Switch colour mode (colours blend)"
            >
              Recolour
            </button>
            <button
              type="button"
              data-action="pulse"
              title="Flare a random item"
            >
              Pulse
            </button>
            <button
              type="button"
              data-action="flash"
              title="Make a dozen items glow for a moment"
            >
              Flash
            </button>
            <button
              type="button"
              data-action="lineage"
              title="Light a random item's lineage"
            >
              Lineage
            </button>
            <button type="button" data-action="export" title="Save as PNG">
              Export PNG
            </button>
          </div>
          <p class="sb-hint muted small">
            Click an item to select it, double-click to collapse or expand it,
            right-click (or long-press) to make it flare, drag it to feel the
            physics.
          </p>
        </details>

        <details class="sb-group" open>
          <summary>Engine</summary>
          <dl id="sbStats" class="sb-stats" aria-live="off"></dl>
        </details>

        <div id="sbOptions" class="options-panel"></div>
      </aside>

      <section class="sb-stage" aria-label="Graph">
        <div id="cyWrap">
          <div
            id="cy"
            tabindex="0"
            role="application"
            aria-roledescription="sandbox graph"
            aria-label="A generated crafting graph to play with."
          ></div>
          <div class="graph-tools sb-tools">
            <button
              type="button"
              data-graph="fit"
              title="Fit the graph"
              aria-label="Fit the graph"
            >
              ⤢
            </button>
            <button
              type="button"
              data-graph="zoom-in"
              title="Zoom in"
              aria-label="Zoom in"
            >
              +
            </button>
            <button
              type="button"
              data-graph="zoom-out"
              title="Zoom out"
              aria-label="Zoom out"
            >
              −
            </button>
          </div>
          <div id="sbTooltip" class="sb-tooltip" hidden></div>
          <p id="sbUnsupported" class="sb-unsupported" hidden>
            This browser can't run Prism (it needs WebGL2).
          </p>
        </div>
      </section>
    </main>

    <footer id="status">
      <span id="statusText" role="status" aria-live="polite"></span>
    </footer>

    <script type="module" src="src/sandbox-main.js"></script>
  </body>
</html>
