# Verify + build on main and beta, and on pull requests into main (the "verify" check main's ruleset requires).
# Feature branches aren't run; they're checked once merged into beta.
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
